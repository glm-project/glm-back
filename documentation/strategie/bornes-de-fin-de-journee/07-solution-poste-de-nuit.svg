<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Frise d&#x27;un poste de nuit de dimanche 20 h à lundi 8 h : une seule journée, la réidentification de 3 h est absorbée, le relevé découpe à minuit : 4 h en semaine 20 et 8 h en semaine 21.">
<title>Solution — Le poste de nuit reste une seule journée</title>

<style>
svg { --bg:#ffffff; --fg:#1f2328; --mu:#59636e; --ax:#d0d7de; --band:#fff1e5;
  --pres:#0969da; --presl:#ddf4ff; --of:#1a7f37; --ofl:#dafbe1; --ko:#cf222e; --kol:#ffebe9;
  --warn:#bc4c00; --card:#f6f8fa; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --mu:#9198a1; --ax:#3d444d; --band:#2d1d0f;
    --pres:#4493f8; --presl:#0c2d4f; --of:#3fb950; --ofl:#0f3319; --ko:#f85149; --kol:#3d1418;
    --warn:#db6d28; --card:#161b22; }
}
text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:13px; fill:var(--fg); }
.titre { font-size:18px; font-weight:700; }
.sous { font-size:13px; fill:var(--mu); }
.mu { fill:var(--mu); font-size:12px; }
.b { font-weight:700; }
.ko { fill:var(--ko); } .ok { fill:var(--of); } .warn { fill:var(--warn); } .bleu { fill:var(--pres); }
.ax { stroke:var(--ax); stroke-width:1; }
.minuit { stroke:var(--mu); stroke-width:1.5; stroke-dasharray:2 3; }
.seuil { stroke:var(--warn); stroke-width:2; stroke-dasharray:6 4; }
.band { fill:var(--band); }
.pres { fill:var(--pres); }
.presp { fill:var(--presl); stroke:var(--pres); stroke-width:1.5; stroke-dasharray:5 3; }
.of { fill:var(--of); }
.ofp { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; stroke-dasharray:5 3; }
.err { fill:url(#hachure); stroke:var(--ko); stroke-width:1.5; }
.hach { stroke:var(--ko); stroke-width:2; }
.gris { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.card { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.cardko { fill:var(--kol); stroke:var(--ko); stroke-width:1.5; }
.cardok { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; }
.fl { stroke:var(--fg); stroke-width:1.5; fill:none; }
.flko { stroke:var(--ko); stroke-width:1.5; fill:none; }
.flwarn { stroke:var(--warn); stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
.pt { fill:var(--bg); stroke:var(--fg); stroke-width:1.5; }
.croix { stroke:var(--ko); stroke-width:3; stroke-linecap:round; }
.fond { fill:var(--bg); }
.ptfg { fill:var(--fg); } .ptko { fill:var(--ko); } .ptwarn { fill:var(--warn); }
</style>
<defs>
  <pattern id="hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" style="fill:var(--kol)"/>
    <line x1="0" y1="0" x2="0" y2="8" class="hach"/>
  </pattern>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptfg"/>
  </marker>
  <marker id="flecheko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptko"/>
  </marker>
  <marker id="flechewarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptwarn"/>
  </marker>
</defs>

<rect width="960" height="430" class="fond"/>

<text x="24" y="34" class="titre">Solution — Le poste de nuit reste une seule journée</text>
<text x="24" y="56" class="sous">Arrivée dimanche 17 mai 20:00, départ lundi 18 mai 08:00. Seuil 13 h.</text>
<rect x="291.2" y="100.0" width="593.1" height="130.0" rx="0" class="band"/>
<line x1="884.4" y1="96.0" x2="884.4" y2="230.0" class="seuil"/>
<text x="878.4" y="112.0" text-anchor="end" class="warn b">seuil : 20:00 + 13 h</text>
<line x1="291.2" y1="100.0" x2="291.2" y2="230.0" class="ax"/>
<text x="291.2" y="246.0" text-anchor="middle" class="mu">dim. 17 20:00</text>
<line x1="610.6" y1="100.0" x2="610.6" y2="230.0" class="ax"/>
<text x="610.6" y="246.0" text-anchor="middle" class="mu">lun. 18 03:00</text>
<line x1="838.8" y1="100.0" x2="838.8" y2="230.0" class="ax"/>
<text x="838.8" y="246.0" text-anchor="middle" class="mu">lun. 18 08:00</text>
<line x1="473.8" y1="94.0" x2="473.8" y2="230.0" class="minuit"/>
<text x="473.8" y="90.0" text-anchor="middle" class="mu">minuit</text>
<text x="24.0" y="166.0" text-anchor="start">Présence</text>
<text x="24.0" y="182.0" text-anchor="start">de Dupont</text>
<rect x="291.2" y="159.0" width="547.5" height="22.0" rx="3" class="pres"/>
<circle cx="610.6" cy="140.0" r="5" class="pt"/>
<text x="610.6" y="128.0" text-anchor="middle">03:00 : réidentification → même journée</text>
<line x1="610.6" y1="145.0" x2="610.6" y2="159.0" class="fl"/>
<text x="565.0" y="202.0" text-anchor="middle" class="bleu b">une seule journée : 12 h</text>
<rect x="291.2" y="280.0" width="176.5" height="70.0" rx="6" class="card"/>
<text x="303.2" y="304.0" text-anchor="start">Semaine 20</text>
<text x="303.2" y="324.0" text-anchor="start">dimanche 17 : 4 h</text>
<rect x="479.8" y="280.0" width="359.0" height="70.0" rx="6" class="card"/>
<text x="491.8" y="304.0" text-anchor="start">Semaine 21</text>
<text x="491.8" y="324.0" text-anchor="start">lundi 18 : 8 h</text>
<line x1="473.8" y1="240.0" x2="473.8" y2="360.0" class="minuit"/>
<text x="24.0" y="310.0" text-anchor="start" class="b">Relevé des heures</text>
<text x="24.0" y="328.0" text-anchor="start" class="mu">(découpe à minuit)</text>
<rect x="24.0" y="384.0" width="18.0" height="14.0" rx="2" class="pres"/>
<text x="50.0" y="395.0" text-anchor="start" class="mu">présence pointée</text>
<rect x="179.2" y="384.0" width="18.0" height="14.0" rx="2" class="band"/>
<text x="205.2" y="395.0" text-anchor="start" class="mu">fenêtre du seuil</text>
<line x1="334.4" y1="391.0" x2="352.4" y2="391.0" class="seuil"/>
<text x="360.4" y="395.0" text-anchor="start" class="mu">seuil</text>
<text x="24.0" y="418.0" text-anchor="start" class="mu">Minuit ne ferme jamais une journée : il ne sert qu&#x27;à répartir les heures dans le relevé (décision révisable).</text>
</svg>
