<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Frise : la journée de lundi est abandonnée à 20 h ; le départ reçu mardi 8 h 30 ouvre une nouvelle journée par une arrivée implicite, suivie du départ, de durée nulle ; aucun refus.">
<title>Solution — Un geste tardif n&#x27;est jamais refusé</title>

<style>
svg { --bg:#ffffff; --fg:#1f2328; --mu:#59636e; --ax:#d0d7de; --band:#fff1e5;
  --pres:#0969da; --presl:#ddf4ff; --of:#1a7f37; --ofl:#dafbe1; --ko:#cf222e; --kol:#ffebe9;
  --warn:#bc4c00; --card:#f6f8fa; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --mu:#9198a1; --ax:#3d444d; --band:#2d1d0f;
    --pres:#4493f8; --presl:#0c2d4f; --of:#3fb950; --ofl:#0f3319; --ko:#f85149; --kol:#3d1418;
    --warn:#db6d28; --card:#161b22; }
}
text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:13px; fill:var(--fg); }
.titre { font-size:18px; font-weight:700; }
.sous { font-size:13px; fill:var(--mu); }
.mu { fill:var(--mu); font-size:12px; }
.b { font-weight:700; }
.ko { fill:var(--ko); } .ok { fill:var(--of); } .warn { fill:var(--warn); } .bleu { fill:var(--pres); }
.ax { stroke:var(--ax); stroke-width:1; }
.minuit { stroke:var(--mu); stroke-width:1.5; stroke-dasharray:2 3; }
.seuil { stroke:var(--warn); stroke-width:2; stroke-dasharray:6 4; }
.band { fill:var(--band); }
.pres { fill:var(--pres); }
.presp { fill:var(--presl); stroke:var(--pres); stroke-width:1.5; stroke-dasharray:5 3; }
.of { fill:var(--of); }
.ofp { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; stroke-dasharray:5 3; }
.err { fill:url(#hachure); stroke:var(--ko); stroke-width:1.5; }
.hach { stroke:var(--ko); stroke-width:2; }
.gris { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.card { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.cardko { fill:var(--kol); stroke:var(--ko); stroke-width:1.5; }
.cardok { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; }
.fl { stroke:var(--fg); stroke-width:1.5; fill:none; }
.flko { stroke:var(--ko); stroke-width:1.5; fill:none; }
.flwarn { stroke:var(--warn); stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
.pt { fill:var(--bg); stroke:var(--fg); stroke-width:1.5; }
.croix { stroke:var(--ko); stroke-width:3; stroke-linecap:round; }
.fond { fill:var(--bg); }
.ptfg { fill:var(--fg); } .ptko { fill:var(--ko); } .ptwarn { fill:var(--warn); }
</style>
<defs>
  <pattern id="hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" style="fill:var(--kol)"/>
    <line x1="0" y1="0" x2="0" y2="8" class="hach"/>
  </pattern>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptfg"/>
  </marker>
  <marker id="flecheko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptko"/>
  </marker>
  <marker id="flechewarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptwarn"/>
  </marker>
</defs>

<rect width="960" height="400" class="fond"/>

<text x="24" y="34" class="titre">Solution — Un geste tardif n&#x27;est jamais refusé</text>
<text x="24" y="56" class="sous">Le pupitre est hors ligne depuis lundi 16:00 et affiche encore Dupont présent. Mardi 08:30, Dupont appuie sur « départ ».</text>
<line x1="226.1" y1="90.0" x2="226.1" y2="300.0" class="ax"/>
<text x="226.1" y="316.0" text-anchor="middle" class="mu">lun. 07:00</text>
<line x1="460.7" y1="90.0" x2="460.7" y2="300.0" class="ax"/>
<text x="460.7" y="316.0" text-anchor="middle" class="mu">lun. 16:00</text>
<line x1="565.0" y1="90.0" x2="565.0" y2="300.0" class="ax"/>
<text x="565.0" y="316.0" text-anchor="middle" class="mu">lun. 20:00</text>
<line x1="890.9" y1="90.0" x2="890.9" y2="300.0" class="ax"/>
<text x="890.9" y="316.0" text-anchor="middle" class="mu">mar. 08:30</text>
<line x1="669.3" y1="84.0" x2="669.3" y2="300.0" class="minuit"/>
<text x="669.3" y="80.0" text-anchor="middle" class="mu">minuit</text>
<text x="24.0" y="134.0" text-anchor="start">Réseau du pupitre</text>
<rect x="200.0" y="122.0" width="260.7" height="16.0" rx="3" class="cardok"/>
<rect x="460.7" y="122.0" width="432.8" height="16.0" rx="3" class="gris"/>
<text x="669.3" y="134.0" text-anchor="middle" class="mu">hors ligne</text>
<text x="24.0" y="194.0" text-anchor="start">Journée de lundi</text>
<rect x="226.1" y="179.0" width="130.4" height="22.0" rx="3" class="presp"/>
<text x="364.4" y="194.0" text-anchor="start" class="mu">fin présumée au dernier fait connu</text>
<line x1="565.0" y1="150.0" x2="565.0" y2="280.0" class="seuil"/>
<text x="571.0" y="158.0" text-anchor="start" class="warn b">abandonnée</text>
<text x="24.0" y="259.0" text-anchor="start">Journée de mardi</text>
<line x1="890.9" y1="241" x2="890.9" y2="269" style="stroke:var(--pres);stroke-width:4"/>
<text x="878.9" y="235.0" text-anchor="end" class="b">08:30 : arrivée implicite + départ</text>
<text x="878.9" y="251.0" text-anchor="end" class="ok b">journée de durée nulle, aucun refus</text>
<rect x="24.0" y="320.0" width="912.0" height="40.0" rx="6" class="card"/>
<text x="40.0" y="345.0" text-anchor="start">Règle : tout geste reçu pour une journée abandonnée ouvre d&#x27;abord une nouvelle journée à son heure, puis s&#x27;applique.</text>
<text x="24.0" y="385.0" text-anchor="start" class="mu">Une pause reçue de la même façon ouvre une journée qui commence en pause. La journée de lundi reste en anomalie.</text>
</svg>
