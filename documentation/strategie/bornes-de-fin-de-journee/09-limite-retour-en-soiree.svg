<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Deux frises : en réalité Dupont est absent de 17 h à 19 h 30 ; l&#x27;application compte une seule journée de 7 h à 23 h, soit 2 h 30 à tort, signalée en amplitude excessive, et non corrigeable avec les actes actuels.">
<title>Limite — Le retour en soirée sous le seuil</title>

<style>
svg { --bg:#ffffff; --fg:#1f2328; --mu:#59636e; --ax:#d0d7de; --band:#fff1e5;
  --pres:#0969da; --presl:#ddf4ff; --of:#1a7f37; --ofl:#dafbe1; --ko:#cf222e; --kol:#ffebe9;
  --warn:#bc4c00; --card:#f6f8fa; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --mu:#9198a1; --ax:#3d444d; --band:#2d1d0f;
    --pres:#4493f8; --presl:#0c2d4f; --of:#3fb950; --ofl:#0f3319; --ko:#f85149; --kol:#3d1418;
    --warn:#db6d28; --card:#161b22; }
}
text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:13px; fill:var(--fg); }
.titre { font-size:18px; font-weight:700; }
.sous { font-size:13px; fill:var(--mu); }
.mu { fill:var(--mu); font-size:12px; }
.b { font-weight:700; }
.ko { fill:var(--ko); } .ok { fill:var(--of); } .warn { fill:var(--warn); } .bleu { fill:var(--pres); }
.ax { stroke:var(--ax); stroke-width:1; }
.minuit { stroke:var(--mu); stroke-width:1.5; stroke-dasharray:2 3; }
.seuil { stroke:var(--warn); stroke-width:2; stroke-dasharray:6 4; }
.band { fill:var(--band); }
.pres { fill:var(--pres); }
.presp { fill:var(--presl); stroke:var(--pres); stroke-width:1.5; stroke-dasharray:5 3; }
.of { fill:var(--of); }
.ofp { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; stroke-dasharray:5 3; }
.err { fill:url(#hachure); stroke:var(--ko); stroke-width:1.5; }
.hach { stroke:var(--ko); stroke-width:2; }
.gris { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.card { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.cardko { fill:var(--kol); stroke:var(--ko); stroke-width:1.5; }
.cardok { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; }
.fl { stroke:var(--fg); stroke-width:1.5; fill:none; }
.flko { stroke:var(--ko); stroke-width:1.5; fill:none; }
.flwarn { stroke:var(--warn); stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
.pt { fill:var(--bg); stroke:var(--fg); stroke-width:1.5; }
.croix { stroke:var(--ko); stroke-width:3; stroke-linecap:round; }
.fond { fill:var(--bg); }
.ptfg { fill:var(--fg); } .ptko { fill:var(--ko); } .ptwarn { fill:var(--warn); }
</style>
<defs>
  <pattern id="hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" style="fill:var(--kol)"/>
    <line x1="0" y1="0" x2="0" y2="8" class="hach"/>
  </pattern>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptfg"/>
  </marker>
  <marker id="flecheko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptko"/>
  </marker>
  <marker id="flechewarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptwarn"/>
  </marker>
</defs>

<rect width="960" height="470" class="fond"/>

<text x="24" y="34" class="titre">Limite — Le retour en soirée sous le seuil</text>
<text x="24" y="56" class="sous">Dupont part à 17:00 sans pointer, revient à 19:30 (12 h 30 après son arrivée), repart à 23:00.</text>
<line x1="240.6" y1="90.0" x2="240.6" y2="230.0" class="ax"/>
<text x="240.6" y="246.0" text-anchor="middle" class="mu">lun. 07:00</text>
<line x1="646.1" y1="90.0" x2="646.1" y2="230.0" class="ax"/>
<text x="646.1" y="246.0" text-anchor="middle" class="mu">lun. 17:00</text>
<line x1="747.5" y1="90.0" x2="747.5" y2="230.0" class="ax"/>
<text x="747.5" y="246.0" text-anchor="middle" class="mu">lun. 19:30</text>
<line x1="889.4" y1="90.0" x2="889.4" y2="230.0" class="ax"/>
<text x="889.4" y="246.0" text-anchor="middle" class="mu">lun. 23:00</text>
<text x="24.0" y="134.0" text-anchor="start">Réalité</text>
<rect x="240.6" y="119.0" width="405.6" height="22.0" rx="3" class="pres"/>
<rect x="747.5" y="119.0" width="141.9" height="22.0" rx="3" class="pres"/>
<text x="696.8" y="134.0" text-anchor="middle" class="mu">chez lui</text>
<text x="24.0" y="186.0" text-anchor="start">Ce que compte</text>
<text x="24.0" y="202.0" text-anchor="start">l&#x27;application</text>
<rect x="240.6" y="179.0" width="405.6" height="22.0" rx="3" class="pres"/>
<rect x="646.1" y="179.0" width="101.4" height="22.0" rx="3" class="err"/>
<rect x="747.5" y="179.0" width="141.9" height="22.0" rx="3" class="pres"/>
<text x="696.8" y="220.0" text-anchor="middle" class="ko b">2 h 30 à tort</text>
<line x1="767.8" y1="100.0" x2="767.8" y2="215.0" class="seuil"/>
<text x="773.8" y="108.0" text-anchor="start" class="warn b">seuil 13 h</text>
<rect x="24.0" y="270.0" width="440.0" height="64.0" rx="6" class="cardko"/>
<text x="40.0" y="294.0" text-anchor="start" class="ko">19:30 : arrivée redondante (12 h 30 &lt; 13 h)</text>
<text x="40.0" y="312.0" text-anchor="start" class="ko">→ même journée, 07:00 → 23:00 = 16 h</text>
<rect x="496.0" y="270.0" width="440.0" height="64.0" rx="6" class="card"/>
<text x="512.0" y="294.0" text-anchor="start" class="warn b">Anomalie « amplitude excessive » :</text>
<text x="512.0" y="312.0" text-anchor="start" class="warn b">16 h &gt; 13 h, visible par le gestionnaire</text>
<text x="24.0" y="368.0" text-anchor="start" class="b">Pourquoi le gestionnaire ne peut pas corriger aujourd&#x27;hui :</text>
<text x="24.0" y="390.0" text-anchor="start">• insérer un départ à 17:00 seul → le départ de 23:00 n&#x27;a plus d&#x27;arrivée avant lui ;</text>
<text x="24.0" y="410.0" text-anchor="start">• insérer une arrivée à 19:30 seule → deux arrivées de suite ;</text>
<text x="24.0" y="430.0" text-anchor="start">• la correction ne remplace qu&#x27;un événement à la fois.  ⇒ Lot 7 : un acte « scinder la journée ».</text>
</svg>
