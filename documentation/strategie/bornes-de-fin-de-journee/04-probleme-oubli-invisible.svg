<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Trois écrans lundi 21 h : le pupitre affiche Dupont présent, le relevé des heures affiche 0 h, le gestionnaire n&#x27;a aucune alerte.">
<title>Problème 4 — Personne ne voit l&#x27;oubli</title>

<style>
svg { --bg:#ffffff; --fg:#1f2328; --mu:#59636e; --ax:#d0d7de; --band:#fff1e5;
  --pres:#0969da; --presl:#ddf4ff; --of:#1a7f37; --ofl:#dafbe1; --ko:#cf222e; --kol:#ffebe9;
  --warn:#bc4c00; --card:#f6f8fa; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --mu:#9198a1; --ax:#3d444d; --band:#2d1d0f;
    --pres:#4493f8; --presl:#0c2d4f; --of:#3fb950; --ofl:#0f3319; --ko:#f85149; --kol:#3d1418;
    --warn:#db6d28; --card:#161b22; }
}
text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:13px; fill:var(--fg); }
.titre { font-size:18px; font-weight:700; }
.sous { font-size:13px; fill:var(--mu); }
.mu { fill:var(--mu); font-size:12px; }
.b { font-weight:700; }
.ko { fill:var(--ko); } .ok { fill:var(--of); } .warn { fill:var(--warn); } .bleu { fill:var(--pres); }
.ax { stroke:var(--ax); stroke-width:1; }
.minuit { stroke:var(--mu); stroke-width:1.5; stroke-dasharray:2 3; }
.seuil { stroke:var(--warn); stroke-width:2; stroke-dasharray:6 4; }
.band { fill:var(--band); }
.pres { fill:var(--pres); }
.presp { fill:var(--presl); stroke:var(--pres); stroke-width:1.5; stroke-dasharray:5 3; }
.of { fill:var(--of); }
.ofp { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; stroke-dasharray:5 3; }
.err { fill:url(#hachure); stroke:var(--ko); stroke-width:1.5; }
.hach { stroke:var(--ko); stroke-width:2; }
.gris { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.card { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.cardko { fill:var(--kol); stroke:var(--ko); stroke-width:1.5; }
.cardok { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; }
.fl { stroke:var(--fg); stroke-width:1.5; fill:none; }
.flko { stroke:var(--ko); stroke-width:1.5; fill:none; }
.flwarn { stroke:var(--warn); stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
.pt { fill:var(--bg); stroke:var(--fg); stroke-width:1.5; }
.croix { stroke:var(--ko); stroke-width:3; stroke-linecap:round; }
.fond { fill:var(--bg); }
.ptfg { fill:var(--fg); } .ptko { fill:var(--ko); } .ptwarn { fill:var(--warn); }
</style>
<defs>
  <pattern id="hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" style="fill:var(--kol)"/>
    <line x1="0" y1="0" x2="0" y2="8" class="hach"/>
  </pattern>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptfg"/>
  </marker>
  <marker id="flecheko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptko"/>
  </marker>
  <marker id="flechewarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptwarn"/>
  </marker>
</defs>

<rect width="960" height="340" class="fond"/>

<text x="24" y="34" class="titre">Problème 4 — Personne ne voit l&#x27;oubli</text>
<text x="24" y="56" class="sous">Lundi 21:00 : Dupont est parti à 17:00 sans pointer. Ce que chacun voit à ce moment.</text>
<rect x="24.0" y="80.0" width="290.0" height="170.0" rx="8" class="card"/>
<text x="40.0" y="106.0" text-anchor="start" class="b">Pupitre (atelier)</text>
<line x1="24.0" y1="118.0" x2="314.0" y2="118.0" class="ax"/>
<text x="169.0" y="160.0" text-anchor="middle" class="mu" style="font-size:14px">Dupont</text>
<text x="169.0" y="196.0" text-anchor="middle" class="b" style="font-size:24px">● Présent</text>
<rect x="40.0" y="214.0" width="258.0" height="26.0" rx="4" class="cardko"/>
<text x="169.0" y="232.0" text-anchor="middle" class="ko">alors qu&#x27;il est chez lui</text>
<rect x="334.0" y="80.0" width="290.0" height="170.0" rx="8" class="card"/>
<text x="350.0" y="106.0" text-anchor="start" class="b">Relevé des heures (assistante)</text>
<line x1="334.0" y1="118.0" x2="624.0" y2="118.0" class="ax"/>
<text x="479.0" y="160.0" text-anchor="middle" class="mu" style="font-size:14px">Lundi</text>
<text x="479.0" y="196.0" text-anchor="middle" class="b" style="font-size:24px">0 h 00</text>
<rect x="350.0" y="214.0" width="258.0" height="26.0" rx="4" class="cardko"/>
<text x="479.0" y="232.0" text-anchor="middle" class="ko">journée non fermée = non comptée</text>
<rect x="644.0" y="80.0" width="290.0" height="170.0" rx="8" class="card"/>
<text x="660.0" y="106.0" text-anchor="start" class="b">Back-office (gestionnaire)</text>
<line x1="644.0" y1="118.0" x2="934.0" y2="118.0" class="ax"/>
<text x="789.0" y="160.0" text-anchor="middle" class="mu" style="font-size:14px">Anomalies</text>
<text x="789.0" y="196.0" text-anchor="middle" class="b" style="font-size:24px">— aucune —</text>
<rect x="660.0" y="214.0" width="258.0" height="26.0" rx="4" class="cardko"/>
<text x="789.0" y="232.0" text-anchor="middle" class="ko">rien ne signale l&#x27;oubli</text>
<text x="24.0" y="290.0" text-anchor="start" class="mu">L&#x27;oubli n&#x27;est découvert que si quelqu&#x27;un le signale : c&#x27;est pourtant le gestionnaire qui</text>
<text x="24.0" y="307.0" text-anchor="start" class="mu">doit rattraper (décision client du 01/08). Il lui faut d&#x27;abord le voir.</text>
</svg>
