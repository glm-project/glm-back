<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Diagramme de séquence : l&#x27;arrivée de mardi 7 h est refusée par le serveur car la journée de lundi est encore ouverte, le pupitre masque le refus, et l&#x27;heure d&#x27;arrivée n&#x27;est enregistrée nulle part.">
<title>Problème 2 — L&#x27;arrivée du lendemain est perdue</title>

<style>
svg { --bg:#ffffff; --fg:#1f2328; --mu:#59636e; --ax:#d0d7de; --band:#fff1e5;
  --pres:#0969da; --presl:#ddf4ff; --of:#1a7f37; --ofl:#dafbe1; --ko:#cf222e; --kol:#ffebe9;
  --warn:#bc4c00; --card:#f6f8fa; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --mu:#9198a1; --ax:#3d444d; --band:#2d1d0f;
    --pres:#4493f8; --presl:#0c2d4f; --of:#3fb950; --ofl:#0f3319; --ko:#f85149; --kol:#3d1418;
    --warn:#db6d28; --card:#161b22; }
}
text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:13px; fill:var(--fg); }
.titre { font-size:18px; font-weight:700; }
.sous { font-size:13px; fill:var(--mu); }
.mu { fill:var(--mu); font-size:12px; }
.b { font-weight:700; }
.ko { fill:var(--ko); } .ok { fill:var(--of); } .warn { fill:var(--warn); } .bleu { fill:var(--pres); }
.ax { stroke:var(--ax); stroke-width:1; }
.minuit { stroke:var(--mu); stroke-width:1.5; stroke-dasharray:2 3; }
.seuil { stroke:var(--warn); stroke-width:2; stroke-dasharray:6 4; }
.band { fill:var(--band); }
.pres { fill:var(--pres); }
.presp { fill:var(--presl); stroke:var(--pres); stroke-width:1.5; stroke-dasharray:5 3; }
.of { fill:var(--of); }
.ofp { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; stroke-dasharray:5 3; }
.err { fill:url(#hachure); stroke:var(--ko); stroke-width:1.5; }
.hach { stroke:var(--ko); stroke-width:2; }
.gris { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.card { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.cardko { fill:var(--kol); stroke:var(--ko); stroke-width:1.5; }
.cardok { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; }
.fl { stroke:var(--fg); stroke-width:1.5; fill:none; }
.flko { stroke:var(--ko); stroke-width:1.5; fill:none; }
.flwarn { stroke:var(--warn); stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
.pt { fill:var(--bg); stroke:var(--fg); stroke-width:1.5; }
.croix { stroke:var(--ko); stroke-width:3; stroke-linecap:round; }
.fond { fill:var(--bg); }
.ptfg { fill:var(--fg); } .ptko { fill:var(--ko); } .ptwarn { fill:var(--warn); }
</style>
<defs>
  <pattern id="hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" style="fill:var(--kol)"/>
    <line x1="0" y1="0" x2="0" y2="8" class="hach"/>
  </pattern>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptfg"/>
  </marker>
  <marker id="flecheko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptko"/>
  </marker>
  <marker id="flechewarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptwarn"/>
  </marker>
</defs>

<rect width="960" height="400" class="fond"/>

<text x="24" y="34" class="titre">Problème 2 — L&#x27;arrivée du lendemain est perdue</text>
<text x="24" y="56" class="sous">Mardi 07:00, Dupont s&#x27;identifie au pupitre. Sa journée de lundi n&#x27;a jamais été fermée.</text>
<rect x="80.0" y="80.0" width="140.0" height="34.0" rx="6" class="card"/>
<text x="150.0" y="102.0" text-anchor="middle" class="b">Dupont</text>
<line x1="150.0" y1="114.0" x2="150.0" y2="330.0" class="ax"/>
<rect x="410.0" y="80.0" width="140.0" height="34.0" rx="6" class="card"/>
<text x="480.0" y="102.0" text-anchor="middle" class="b">Pupitre</text>
<line x1="480.0" y1="114.0" x2="480.0" y2="330.0" class="ax"/>
<rect x="740.0" y="80.0" width="140.0" height="34.0" rx="6" class="card"/>
<text x="810.0" y="102.0" text-anchor="middle" class="b">Serveur</text>
<line x1="810.0" y1="114.0" x2="810.0" y2="330.0" class="ax"/>
<line x1="150.0" y1="150.0" x2="474.0" y2="150.0" class="fl" marker-end="url(#fleche)"/>
<text x="315.0" y="142.0" text-anchor="middle">mar. 07:00 — s&#x27;identifie</text>
<line x1="480.0" y1="195.0" x2="804.0" y2="195.0" class="fl" marker-end="url(#fleche)"/>
<text x="645.0" y="187.0" text-anchor="middle">« arrivée 07:00 »</text>
<line x1="810.0" y1="240.0" x2="486.0" y2="240.0" class="flko" marker-end="url(#flecheko)"/>
<text x="645.0" y="232.0" text-anchor="middle" class="ko">refus : journée déjà ouverte (celle de lundi)</text>
<rect x="330.0" y="262.0" width="300.0" height="42.0" rx="6" class="cardko"/>
<text x="480.0" y="280.0" text-anchor="middle" class="ko b">refus avalé sans rien afficher</text>
<text x="480.0" y="297.0" text-anchor="middle" class="ko">Dupont croit être arrivé</text>
<rect x="690.0" y="262.0" width="240.0" height="42.0" rx="6" class="cardko"/>
<line x1="703.0" y1="276.0" x2="717.0" y2="290.0" class="croix"/>
<line x1="703.0" y1="290.0" x2="717.0" y2="276.0" class="croix"/>
<text x="818.0" y="280.0" text-anchor="middle" class="ko b">07:00 enregistré</text>
<text x="818.0" y="297.0" text-anchor="middle" class="ko b">nulle part</text>
<text x="24.0" y="360.0" text-anchor="start" class="mu">La journée de lundi continue d&#x27;absorber mardi : les pointages de mardi s&#x27;y ajoutent,</text>
<text x="24.0" y="377.0" text-anchor="start" class="mu">et l&#x27;heure réelle d&#x27;arrivée de mardi ne peut plus être retrouvée par le gestionnaire.</text>
</svg>
