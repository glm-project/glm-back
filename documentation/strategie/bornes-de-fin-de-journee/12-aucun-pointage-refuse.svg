<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Organigramme : un pointage reçu est enregistré s&#x27;il est applicable ; sinon absorbé s&#x27;il ne change rien ; sinon redressé s&#x27;il peut être complété ; sinon refusé, s&#x27;il ne se rattache à rien ou s&#x27;il est inhabituel : il reste dans le journal local du pupitre et le gestionnaire régularise s&#x27;il le faut. Le pupitre reçoit un succès, sauf pour un geste refusé ou un OF clôturé.">
<title>Un pointage ne rend d&#x27;erreur que s&#x27;il ne se rattache à rien</title>

<style>
svg { --bg:#ffffff; --fg:#1f2328; --mu:#59636e; --ax:#d0d7de; --band:#fff1e5;
  --pres:#0969da; --presl:#ddf4ff; --of:#1a7f37; --ofl:#dafbe1; --ko:#cf222e; --kol:#ffebe9;
  --warn:#bc4c00; --card:#f6f8fa; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --mu:#9198a1; --ax:#3d444d; --band:#2d1d0f;
    --pres:#4493f8; --presl:#0c2d4f; --of:#3fb950; --ofl:#0f3319; --ko:#f85149; --kol:#3d1418;
    --warn:#db6d28; --card:#161b22; }
}
text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:13px; fill:var(--fg); }
.titre { font-size:18px; font-weight:700; }
.sous { font-size:13px; fill:var(--mu); }
.mu { fill:var(--mu); font-size:12px; }
.b { font-weight:700; }
.ko { fill:var(--ko); } .ok { fill:var(--of); } .warn { fill:var(--warn); } .bleu { fill:var(--pres); }
.ax { stroke:var(--ax); stroke-width:1; }
.minuit { stroke:var(--mu); stroke-width:1.5; stroke-dasharray:2 3; }
.seuil { stroke:var(--warn); stroke-width:2; stroke-dasharray:6 4; }
.band { fill:var(--band); }
.pres { fill:var(--pres); }
.presp { fill:var(--presl); stroke:var(--pres); stroke-width:1.5; stroke-dasharray:5 3; }
.of { fill:var(--of); }
.ofp { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; stroke-dasharray:5 3; }
.err { fill:url(#hachure); stroke:var(--ko); stroke-width:1.5; }
.hach { stroke:var(--ko); stroke-width:2; }
.gris { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.card { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.cardko { fill:var(--kol); stroke:var(--ko); stroke-width:1.5; }
.cardok { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; }
.fl { stroke:var(--fg); stroke-width:1.5; fill:none; }
.flko { stroke:var(--ko); stroke-width:1.5; fill:none; }
.flwarn { stroke:var(--warn); stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
.pt { fill:var(--bg); stroke:var(--fg); stroke-width:1.5; }
.croix { stroke:var(--ko); stroke-width:3; stroke-linecap:round; }
.fond { fill:var(--bg); }
.ptfg { fill:var(--fg); } .ptko { fill:var(--ko); } .ptwarn { fill:var(--warn); }
</style>
<defs>
  <pattern id="hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" style="fill:var(--kol)"/>
    <line x1="0" y1="0" x2="0" y2="8" class="hach"/>
  </pattern>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptfg"/>
  </marker>
  <marker id="flecheko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptko"/>
  </marker>
  <marker id="flechewarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptwarn"/>
  </marker>
</defs>

<rect width="960" height="540" class="fond"/>

<text x="24" y="34" class="titre">Aucun pointage ne rend d&#x27;erreur</text>
<text x="24" y="56" class="sous">L&#x27;opérateur n&#x27;est jamais empêché de pointer ni de commencer son activité. Seule exception : un OF clôturé.</text>
<rect x="24.0" y="95.0" width="160.0" height="50.0" rx="8" class="card"/>
<text x="104.0" y="125.0" text-anchor="middle" class="b">Pointage reçu</text>
<line x1="184.0" y1="120.0" x2="226.0" y2="120.0" class="fl" marker-end="url(#fleche)"/>
<rect x="230.0" y="95.0" width="210.0" height="50.0" rx="25" class="card"/>
<text x="335.0" y="125.0" text-anchor="middle" class="b">Applicable tel quel ?</text>
<rect x="230.0" y="185.0" width="210.0" height="50.0" rx="25" class="card"/>
<text x="335.0" y="215.0" text-anchor="middle" class="b">Ne change rien ?</text>
<rect x="230.0" y="275.0" width="210.0" height="50.0" rx="25" class="card"/>
<text x="335.0" y="305.0" text-anchor="middle" class="b">Peut être complété ?</text>
<line x1="440.0" y1="120.0" x2="496.0" y2="120.0" class="fl" marker-end="url(#fleche)"/>
<text x="470.0" y="112.0" text-anchor="middle" class="mu">oui</text>
<rect x="500.0" y="95.0" width="250.0" height="50.0" rx="8" class="cardok"/>
<text x="514.0" y="117.0" text-anchor="start" class="b">Enregistré</text>
<text x="514.0" y="135.0" text-anchor="start" class="mu">le cas normal</text>
<line x1="440.0" y1="210.0" x2="496.0" y2="210.0" class="fl" marker-end="url(#fleche)"/>
<text x="470.0" y="202.0" text-anchor="middle" class="mu">oui</text>
<rect x="500.0" y="185.0" width="250.0" height="50.0" rx="8" class="card"/>
<text x="514.0" y="207.0" text-anchor="start" class="b">Absorbé</text>
<text x="514.0" y="225.0" text-anchor="start" class="mu">rien n&#x27;est ajouté au journal</text>
<line x1="440.0" y1="300.0" x2="496.0" y2="300.0" class="fl" marker-end="url(#fleche)"/>
<text x="470.0" y="292.0" text-anchor="middle" class="mu">oui</text>
<rect x="500.0" y="275.0" width="250.0" height="50.0" rx="8" class="card"/>
<text x="514.0" y="297.0" text-anchor="start" class="b">Redressé</text>
<text x="514.0" y="315.0" text-anchor="start" class="mu">arrivée implicite</text>
<line x1="335.0" y1="145.0" x2="335.0" y2="181.0" class="fl" marker-end="url(#fleche)"/>
<text x="343.0" y="170.0" text-anchor="start" class="mu">non</text>
<line x1="335.0" y1="235.0" x2="335.0" y2="271.0" class="fl" marker-end="url(#fleche)"/>
<text x="343.0" y="260.0" text-anchor="start" class="mu">non</text>
<line x1="335.0" y1="325.0" x2="335.0" y2="390.0" class="fl"/>
<text x="343.0" y="350.0" text-anchor="start" class="mu">non</text>
<line x1="335.0" y1="390.0" x2="496.0" y2="390.0" class="fl" marker-end="url(#fleche)"/>
<rect x="500.0" y="365.0" width="250.0" height="50.0" rx="8" class="cardko"/>
<text x="514.0" y="387.0" text-anchor="start" class="ko b">Refusé (404 / 409)</text>
<text x="514.0" y="405.0" text-anchor="start" class="mu">rattaché à rien, ou inhabituel</text>
<line x1="625.0" y1="415.0" x2="625.0" y2="456.0" class="flko" marker-end="url(#flecheko)"/>
<rect x="440.0" y="460.0" width="370.0" height="44.0" rx="8" class="card"/>
<text x="625.0" y="480.0" text-anchor="middle" class="b">Journal local du pupitre</text>
<text x="625.0" y="497.0" text-anchor="middle" class="mu">le gestionnaire régularise s&#x27;il le faut</text>
<rect x="800.0" y="95.0" width="136.0" height="320.0" rx="8" class="cardok"/>
<text x="868.0" y="220.0" text-anchor="middle" class="ok b">Réponse</text>
<text x="868.0" y="240.0" text-anchor="middle" class="ok b">au pupitre :</text>
<text x="868.0" y="260.0" text-anchor="middle" class="ok b">succès</text>
<text x="868.0" y="300.0" text-anchor="middle" class="mu">sauf OF clôturé</text>
<text x="868.0" y="318.0" text-anchor="middle" class="mu">(message) et</text>
<text x="868.0" y="336.0" text-anchor="middle" class="mu">geste refusé</text>
<line x1="750.0" y1="120.0" x2="796.0" y2="120.0" class="fl" marker-end="url(#fleche)"/>
<line x1="750.0" y1="210.0" x2="796.0" y2="210.0" class="fl" marker-end="url(#fleche)"/>
<line x1="750.0" y1="300.0" x2="796.0" y2="300.0" class="fl" marker-end="url(#fleche)"/>
<text x="24.0" y="530.0" text-anchor="start" class="mu">Hors pointages, restent des erreurs : requête malformée ou non authentifiée, actes du gestionnaire (régularisation, correction, clôture).</text>
</svg>
