<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Deux frises. Avant régularisation : la journée de lundi s&#x27;arrête à la fin présumée de 16 h, dernier fait connu, soit 5 h pointées et 3 h présumées ; mardi 7 h ouvre une nouvelle journée et relance l&#x27;OF 42. Après régularisation d&#x27;un départ à 17 h : 9 h pointées, l&#x27;anomalie disparaît.">
<title>Solution — Fin présumée, nouvelle journée, relance de l&#x27;OF</title>

<style>
svg { --bg:#ffffff; --fg:#1f2328; --mu:#59636e; --ax:#d0d7de; --band:#fff1e5;
  --pres:#0969da; --presl:#ddf4ff; --of:#1a7f37; --ofl:#dafbe1; --ko:#cf222e; --kol:#ffebe9;
  --warn:#bc4c00; --card:#f6f8fa; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --mu:#9198a1; --ax:#3d444d; --band:#2d1d0f;
    --pres:#4493f8; --presl:#0c2d4f; --of:#3fb950; --ofl:#0f3319; --ko:#f85149; --kol:#3d1418;
    --warn:#db6d28; --card:#161b22; }
}
text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:13px; fill:var(--fg); }
.titre { font-size:18px; font-weight:700; }
.sous { font-size:13px; fill:var(--mu); }
.mu { fill:var(--mu); font-size:12px; }
.b { font-weight:700; }
.ko { fill:var(--ko); } .ok { fill:var(--of); } .warn { fill:var(--warn); } .bleu { fill:var(--pres); }
.ax { stroke:var(--ax); stroke-width:1; }
.minuit { stroke:var(--mu); stroke-width:1.5; stroke-dasharray:2 3; }
.seuil { stroke:var(--warn); stroke-width:2; stroke-dasharray:6 4; }
.band { fill:var(--band); }
.pres { fill:var(--pres); }
.presp { fill:var(--presl); stroke:var(--pres); stroke-width:1.5; stroke-dasharray:5 3; }
.of { fill:var(--of); }
.ofp { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; stroke-dasharray:5 3; }
.err { fill:url(#hachure); stroke:var(--ko); stroke-width:1.5; }
.hach { stroke:var(--ko); stroke-width:2; }
.gris { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.card { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.cardko { fill:var(--kol); stroke:var(--ko); stroke-width:1.5; }
.cardok { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; }
.fl { stroke:var(--fg); stroke-width:1.5; fill:none; }
.flko { stroke:var(--ko); stroke-width:1.5; fill:none; }
.flwarn { stroke:var(--warn); stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
.pt { fill:var(--bg); stroke:var(--fg); stroke-width:1.5; }
.croix { stroke:var(--ko); stroke-width:3; stroke-linecap:round; }
.fond { fill:var(--bg); }
.ptfg { fill:var(--fg); } .ptko { fill:var(--ko); } .ptwarn { fill:var(--warn); }
</style>
<defs>
  <pattern id="hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" style="fill:var(--kol)"/>
    <line x1="0" y1="0" x2="0" y2="8" class="hach"/>
  </pattern>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptfg"/>
  </marker>
  <marker id="flecheko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptko"/>
  </marker>
  <marker id="flechewarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptwarn"/>
  </marker>
</defs>

<rect width="960" height="640" class="fond"/>

<text x="24" y="34" class="titre">Solution — Fin présumée, nouvelle journée, relance de l&#x27;OF</text>
<text x="24" y="56" class="sous">Même lundi que le problème 1. La journée devient abandonnée à 20:00 (07:00 + 13 h).</text>
<text x="24.0" y="92.0" text-anchor="start" class="b" style="font-size:14px">A — Avant régularisation (lecture mardi 09:00)</text>
<line x1="227.0" y1="110.0" x2="227.0" y2="300.0" class="ax"/>
<text x="227.0" y="316.0" text-anchor="middle" class="mu">lun. 07:00</text>
<line x1="362.2" y1="110.0" x2="362.2" y2="300.0" class="ax"/>
<text x="362.2" y="316.0" text-anchor="middle" class="mu">lun. 12:00</text>
<line x1="470.4" y1="110.0" x2="470.4" y2="300.0" class="ax"/>
<text x="470.4" y="316.0" text-anchor="middle" class="mu">lun. 16:00</text>
<line x1="578.5" y1="110.0" x2="578.5" y2="300.0" class="ax"/>
<text x="578.5" y="316.0" text-anchor="middle" class="mu">lun. 20:00</text>
<line x1="875.9" y1="110.0" x2="875.9" y2="300.0" class="ax"/>
<text x="875.9" y="316.0" text-anchor="middle" class="mu">mar. 07:00</text>
<line x1="686.7" y1="104.0" x2="686.7" y2="300.0" class="minuit"/>
<text x="686.7" y="100.0" text-anchor="middle" class="mu">minuit</text>
<text x="24.0" y="154.0" text-anchor="start">Présence</text>
<rect x="227.0" y="139.0" width="135.2" height="22.0" rx="3" class="pres"/>
<rect x="389.3" y="139.0" width="81.1" height="22.0" rx="3" class="presp"/>
<rect x="875.9" y="139.0" width="54.1" height="22.0" rx="3" class="pres"/>
<text x="930.0" y="132.0" text-anchor="end" class="ok b">nouvelle journée 07:00</text>
<line x1="578.5" y1="120.0" x2="578.5" y2="290.0" class="seuil"/>
<text x="584.5" y="128.0" text-anchor="start" class="warn b">abandonnée</text>
<text x="24.0" y="201.0" text-anchor="start">OF 42</text>
<text x="24.0" y="217.0" text-anchor="start">(fraiseuse 1)</text>
<rect x="254.1" y="194.0" width="108.1" height="22.0" rx="3" class="of"/>
<rect x="389.3" y="194.0" width="81.1" height="22.0" rx="3" class="ofp"/>
<rect x="878.1" y="194.0" width="51.9" height="22.0" rx="3" class="of"/>
<text x="872.1" y="209.0" text-anchor="end" class="ok b">relancé 07:05</text>
<text x="24.0" y="251.0" text-anchor="start">OF 43</text>
<text x="24.0" y="267.0" text-anchor="start">(fraiseuse 2)</text>
<rect x="281.1" y="244.0" width="81.1" height="22.0" rx="3" class="of"/>
<rect x="389.3" y="244.0" width="81.1" height="22.0" rx="3" class="of"/>
<path d="M470.4,241 L470.4,164" class="fl" marker-end="url(#fleche)"/>
<text x="476.4" y="251.0" text-anchor="start">dernier fait connu : fin OF 43</text>
<text x="476.4" y="267.0" text-anchor="start" class="b">→ fin présumée 16:00</text>
<rect x="24.0" y="330.0" width="912.0" height="30.0" rx="6" class="card"/>
<text x="40.0" y="350.0" text-anchor="start" class="b">Relevé lundi : 5 h pointées + 3 h présumées  ·  Anomalie : journée sans départ  ·  mardi : nouvelle journée</text>
<text x="24.0" y="392.0" text-anchor="start" class="b" style="font-size:14px">B — Après régularisation par le gestionnaire : départ lundi 17:00</text>
<line x1="227.0" y1="410.0" x2="227.0" y2="540.0" class="ax"/>
<text x="227.0" y="556.0" text-anchor="middle" class="mu">lun. 07:00</text>
<line x1="362.2" y1="410.0" x2="362.2" y2="540.0" class="ax"/>
<text x="362.2" y="556.0" text-anchor="middle" class="mu">lun. 12:00</text>
<line x1="497.4" y1="410.0" x2="497.4" y2="540.0" class="ax"/>
<text x="497.4" y="556.0" text-anchor="middle" class="mu">lun. 17:00</text>
<line x1="875.9" y1="410.0" x2="875.9" y2="540.0" class="ax"/>
<text x="875.9" y="556.0" text-anchor="middle" class="mu">mar. 07:00</text>
<line x1="686.7" y1="404.0" x2="686.7" y2="540.0" class="minuit"/>
<text x="686.7" y="400.0" text-anchor="middle" class="mu">minuit</text>
<text x="24.0" y="449.0" text-anchor="start">Présence</text>
<rect x="227.0" y="434.0" width="135.2" height="22.0" rx="3" class="pres"/>
<rect x="389.3" y="434.0" width="108.1" height="22.0" rx="3" class="pres"/>
<rect x="875.9" y="434.0" width="54.1" height="22.0" rx="3" class="pres"/>
<text x="24.0" y="496.0" text-anchor="start">OF 42</text>
<text x="24.0" y="512.0" text-anchor="start">(fraiseuse 1)</text>
<rect x="254.1" y="489.0" width="108.1" height="22.0" rx="3" class="of"/>
<rect x="389.3" y="489.0" width="108.1" height="22.0" rx="3" class="of"/>
<rect x="878.1" y="489.0" width="51.9" height="22.0" rx="3" class="of"/>
<rect x="565.0" y="445.0" width="283.9" height="56.0" rx="6" class="cardok"/>
<text x="577.0" y="467.0" text-anchor="start" class="ok b">Relevé lundi : 9 h pointées</text>
<text x="577.0" y="485.0" text-anchor="start" class="ok b">Anomalie levée</text>
<rect x="24.0" y="589.0" width="18.0" height="14.0" rx="2" class="pres"/>
<text x="50.0" y="600.0" text-anchor="start" class="mu">présence pointée</text>
<rect x="179.2" y="589.0" width="18.0" height="14.0" rx="2" class="presp"/>
<text x="205.2" y="600.0" text-anchor="start" class="mu">présence présumée</text>
<rect x="341.6" y="589.0" width="18.0" height="14.0" rx="2" class="of"/>
<text x="367.6" y="600.0" text-anchor="start" class="mu">OF pointé</text>
<rect x="446.4" y="589.0" width="18.0" height="14.0" rx="2" class="ofp"/>
<text x="472.4" y="600.0" text-anchor="start" class="mu">OF présumé</text>
<line x1="558.4" y1="596.0" x2="576.4" y2="596.0" class="seuil"/>
<text x="584.4" y="600.0" text-anchor="start" class="mu">seuil franchi</text>
<text x="24.0" y="626.0" text-anchor="start" class="mu">La fin présumée n&#x27;invente aucune heure : elle s&#x27;arrête au dernier geste connu, et le gestionnaire la remplace.</text>
</svg>
