<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-label="Carte des huit lots : le lot 1 relance d&#x27;OF est indépendant ; le lot 2 paramétrage précède le lot 3 journée abandonnée, qui précède le lot 4 fin présumée puis le lot 5 relevés, et le lot 6 anomalies puis le lot 7 scission, à instruire, et le lot 8 aucun pointage refusé.">
<title>Découpage en lots et dépendances</title>

<style>
svg { --bg:#ffffff; --fg:#1f2328; --mu:#59636e; --ax:#d0d7de; --band:#fff1e5;
  --pres:#0969da; --presl:#ddf4ff; --of:#1a7f37; --ofl:#dafbe1; --ko:#cf222e; --kol:#ffebe9;
  --warn:#bc4c00; --card:#f6f8fa; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --mu:#9198a1; --ax:#3d444d; --band:#2d1d0f;
    --pres:#4493f8; --presl:#0c2d4f; --of:#3fb950; --ofl:#0f3319; --ko:#f85149; --kol:#3d1418;
    --warn:#db6d28; --card:#161b22; }
}
text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:13px; fill:var(--fg); }
.titre { font-size:18px; font-weight:700; }
.sous { font-size:13px; fill:var(--mu); }
.mu { fill:var(--mu); font-size:12px; }
.b { font-weight:700; }
.ko { fill:var(--ko); } .ok { fill:var(--of); } .warn { fill:var(--warn); } .bleu { fill:var(--pres); }
.ax { stroke:var(--ax); stroke-width:1; }
.minuit { stroke:var(--mu); stroke-width:1.5; stroke-dasharray:2 3; }
.seuil { stroke:var(--warn); stroke-width:2; stroke-dasharray:6 4; }
.band { fill:var(--band); }
.pres { fill:var(--pres); }
.presp { fill:var(--presl); stroke:var(--pres); stroke-width:1.5; stroke-dasharray:5 3; }
.of { fill:var(--of); }
.ofp { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; stroke-dasharray:5 3; }
.err { fill:url(#hachure); stroke:var(--ko); stroke-width:1.5; }
.hach { stroke:var(--ko); stroke-width:2; }
.gris { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.card { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.cardko { fill:var(--kol); stroke:var(--ko); stroke-width:1.5; }
.cardok { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; }
.fl { stroke:var(--fg); stroke-width:1.5; fill:none; }
.flko { stroke:var(--ko); stroke-width:1.5; fill:none; }
.flwarn { stroke:var(--warn); stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
.pt { fill:var(--bg); stroke:var(--fg); stroke-width:1.5; }
.croix { stroke:var(--ko); stroke-width:3; stroke-linecap:round; }
.fond { fill:var(--bg); }
.ptfg { fill:var(--fg); } .ptko { fill:var(--ko); } .ptwarn { fill:var(--warn); }
</style>
<defs>
  <pattern id="hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" style="fill:var(--kol)"/>
    <line x1="0" y1="0" x2="0" y2="8" class="hach"/>
  </pattern>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptfg"/>
  </marker>
  <marker id="flecheko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptko"/>
  </marker>
  <marker id="flechewarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptwarn"/>
  </marker>
</defs>

<rect width="960" height="530" class="fond"/>

<text x="24" y="34" class="titre">Découpage en lots et dépendances</text>
<text x="24" y="56" class="sous">Une flèche signifie « doit être livré avant ». Les lots 1 et 2 peuvent démarrer en parallèle.</text>
<rect x="24.0" y="90.0" width="196.0" height="78.0" rx="8" class="card"/>
<text x="38.0" y="114.0" text-anchor="start" class="mu">Lot 1</text>
<text x="38.0" y="136.0" text-anchor="start" class="b">Relance d&#x27;un OF</text>
<text x="38.0" y="156.0" text-anchor="start" class="mu">E2</text>
<rect x="24.0" y="240.0" width="196.0" height="78.0" rx="8" class="card"/>
<text x="38.0" y="264.0" text-anchor="start" class="mu">Lot 2</text>
<text x="38.0" y="286.0" text-anchor="start" class="b">Paramétrage du seuil</text>
<text x="38.0" y="306.0" text-anchor="start" class="mu">E8</text>
<rect x="264.0" y="240.0" width="196.0" height="78.0" rx="8" class="card"/>
<text x="278.0" y="264.0" text-anchor="start" class="mu">Lot 3</text>
<text x="278.0" y="286.0" text-anchor="start" class="b">Journée abandonnée</text>
<text x="278.0" y="306.0" text-anchor="start" class="mu">E1 E2 E3 E5 E6 E8</text>
<rect x="504.0" y="160.0" width="196.0" height="78.0" rx="8" class="card"/>
<text x="518.0" y="184.0" text-anchor="start" class="mu">Lot 4</text>
<text x="518.0" y="206.0" text-anchor="start" class="b">Fin présumée</text>
<text x="518.0" y="226.0" text-anchor="start" class="mu">E2 E3</text>
<rect x="504.0" y="300.0" width="196.0" height="78.0" rx="8" class="card"/>
<text x="518.0" y="324.0" text-anchor="start" class="mu">Lot 6</text>
<text x="518.0" y="346.0" text-anchor="start" class="b">Liste des anomalies</text>
<text x="518.0" y="366.0" text-anchor="start" class="mu">E2 E3 E4</text>
<rect x="744.0" y="160.0" width="196.0" height="78.0" rx="8" class="card"/>
<text x="758.0" y="184.0" text-anchor="start" class="mu">Lot 5</text>
<text x="758.0" y="206.0" text-anchor="start" class="b">Relevés des heures</text>
<text x="758.0" y="226.0" text-anchor="start" class="mu">E1 E2 E7</text>
<rect x="744.0" y="300.0" width="196.0" height="78.0" rx="8" class="presp"/>
<text x="758.0" y="324.0" text-anchor="start" class="mu">Lot 7</text>
<text x="758.0" y="346.0" text-anchor="start" class="b">Scinder une journée</text>
<text x="758.0" y="366.0" text-anchor="start" class="mu">E4 — à instruire</text>
<rect x="744.0" y="410.0" width="196.0" height="78.0" rx="8" class="card"/>
<text x="758.0" y="434.0" text-anchor="start" class="mu">Lot 8</text>
<text x="758.0" y="456.0" text-anchor="start" class="b">Aucun pointage refusé</text>
<text x="758.0" y="476.0" text-anchor="start" class="mu">tableau des refus, E5</text>
<path d="M220,279.0 C242.0,279.0 242.0,279.0 260,279.0" class="fl" marker-end="url(#fleche)"/>
<path d="M460,279.0 C482.0,279.0 482.0,199.0 500,199.0" class="fl" marker-end="url(#fleche)"/>
<path d="M460,279.0 C482.0,279.0 482.0,339.0 500,339.0" class="fl" marker-end="url(#fleche)"/>
<path d="M700,199.0 C722.0,199.0 722.0,199.0 740,199.0" class="fl" marker-end="url(#fleche)"/>
<path d="M700,339.0 C722.0,339.0 722.0,339.0 740,339.0" class="fl" marker-end="url(#fleche)"/>
<path d="M700,339.0 C722.0,339.0 722.0,449.0 740,449.0" class="fl" marker-end="url(#fleche)"/>
<text x="240.0" y="134.0" text-anchor="start" class="mu">indépendant</text>
<text x="24.0" y="514.0" text-anchor="start" class="mu">Les lots 1, 3 et 8 garantissent qu&#x27;aucun pointage n&#x27;est refusé ; le lot 6 rend visible au gestionnaire ce qui reste à traiter.</text>
</svg>
