<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Frise de lundi 6 h à mardi 9 h : la présence de Dupont et son travail sur l&#x27;OF 42 ne s&#x27;arrêtent jamais après son départ réel de 17 h, la nuit est comptée à tort.">
<title>Problème 1 — Une journée sans départ n&#x27;a pas de fin</title>

<style>
svg { --bg:#ffffff; --fg:#1f2328; --mu:#59636e; --ax:#d0d7de; --band:#fff1e5;
  --pres:#0969da; --presl:#ddf4ff; --of:#1a7f37; --ofl:#dafbe1; --ko:#cf222e; --kol:#ffebe9;
  --warn:#bc4c00; --card:#f6f8fa; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --fg:#e6edf3; --mu:#9198a1; --ax:#3d444d; --band:#2d1d0f;
    --pres:#4493f8; --presl:#0c2d4f; --of:#3fb950; --ofl:#0f3319; --ko:#f85149; --kol:#3d1418;
    --warn:#db6d28; --card:#161b22; }
}
text { font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:13px; fill:var(--fg); }
.titre { font-size:18px; font-weight:700; }
.sous { font-size:13px; fill:var(--mu); }
.mu { fill:var(--mu); font-size:12px; }
.b { font-weight:700; }
.ko { fill:var(--ko); } .ok { fill:var(--of); } .warn { fill:var(--warn); } .bleu { fill:var(--pres); }
.ax { stroke:var(--ax); stroke-width:1; }
.minuit { stroke:var(--mu); stroke-width:1.5; stroke-dasharray:2 3; }
.seuil { stroke:var(--warn); stroke-width:2; stroke-dasharray:6 4; }
.band { fill:var(--band); }
.pres { fill:var(--pres); }
.presp { fill:var(--presl); stroke:var(--pres); stroke-width:1.5; stroke-dasharray:5 3; }
.of { fill:var(--of); }
.ofp { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; stroke-dasharray:5 3; }
.err { fill:url(#hachure); stroke:var(--ko); stroke-width:1.5; }
.hach { stroke:var(--ko); stroke-width:2; }
.gris { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.card { fill:var(--card); stroke:var(--ax); stroke-width:1; }
.cardko { fill:var(--kol); stroke:var(--ko); stroke-width:1.5; }
.cardok { fill:var(--ofl); stroke:var(--of); stroke-width:1.5; }
.fl { stroke:var(--fg); stroke-width:1.5; fill:none; }
.flko { stroke:var(--ko); stroke-width:1.5; fill:none; }
.flwarn { stroke:var(--warn); stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
.pt { fill:var(--bg); stroke:var(--fg); stroke-width:1.5; }
.croix { stroke:var(--ko); stroke-width:3; stroke-linecap:round; }
.fond { fill:var(--bg); }
.ptfg { fill:var(--fg); } .ptko { fill:var(--ko); } .ptwarn { fill:var(--warn); }
</style>
<defs>
  <pattern id="hachure" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" style="fill:var(--kol)"/>
    <line x1="0" y1="0" x2="0" y2="8" class="hach"/>
  </pattern>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptfg"/>
  </marker>
  <marker id="flecheko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptko"/>
  </marker>
  <marker id="flechewarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ptwarn"/>
  </marker>
</defs>

<rect width="960" height="360" class="fond"/>

<text x="24" y="34" class="titre">Problème 1 — Une journée sans départ n&#x27;a pas de fin</text>
<text x="24" y="56" class="sous">Dupont part lundi à 17:00 sans rien pointer. Lecture mardi 09:00.</text>
<line x1="227.0" y1="90.0" x2="227.0" y2="270.0" class="ax"/>
<text x="227.0" y="286.0" text-anchor="middle" class="mu">lun. 07:00</text>
<line x1="362.2" y1="90.0" x2="362.2" y2="270.0" class="ax"/>
<text x="362.2" y="286.0" text-anchor="middle" class="mu">lun. 12:00</text>
<line x1="497.4" y1="90.0" x2="497.4" y2="270.0" class="ax"/>
<text x="497.4" y="286.0" text-anchor="middle" class="mu">lun. 17:00</text>
<line x1="875.9" y1="90.0" x2="875.9" y2="270.0" class="ax"/>
<text x="875.9" y="286.0" text-anchor="middle" class="mu">mar. 07:00</text>
<line x1="686.7" y1="84.0" x2="686.7" y2="270.0" class="minuit"/>
<text x="686.7" y="80.0" text-anchor="middle" class="mu">minuit</text>
<text x="24.0" y="126.0" text-anchor="start">Présence</text>
<text x="24.0" y="142.0" text-anchor="start">(journée de lundi)</text>
<rect x="227.0" y="119.0" width="135.2" height="22.0" rx="3" class="pres"/>
<rect x="389.3" y="119.0" width="108.1" height="22.0" rx="3" class="pres"/>
<rect x="497.4" y="119.0" width="432.6" height="22.0" rx="3" class="err"/>
<text x="713.7" y="112.0" text-anchor="middle" class="ko b">journée jamais fermée : la nuit compte en présence</text>
<line x1="928.0" y1="130.0" x2="944.0" y2="130.0" class="flko" marker-end="url(#flecheko)"/>
<text x="24.0" y="181.0" text-anchor="start">OF 42</text>
<text x="24.0" y="197.0" text-anchor="start">(fraiseuse 1)</text>
<rect x="254.1" y="174.0" width="108.1" height="22.0" rx="3" class="of"/>
<rect x="389.3" y="174.0" width="108.1" height="22.0" rx="3" class="of"/>
<rect x="497.4" y="174.0" width="432.6" height="22.0" rx="3" class="err"/>
<text x="713.7" y="167.0" text-anchor="middle" class="ko b">OF jamais arrêté : la nuit compte sur l&#x27;OF</text>
<line x1="928.0" y1="185.0" x2="944.0" y2="185.0" class="flko" marker-end="url(#flecheko)"/>
<text x="24.0" y="231.0" text-anchor="start">OF 43</text>
<text x="24.0" y="247.0" text-anchor="start">(fraiseuse 2)</text>
<rect x="281.1" y="224.0" width="81.1" height="22.0" rx="3" class="of"/>
<rect x="389.3" y="224.0" width="81.1" height="22.0" rx="3" class="of"/>
<text x="478.4" y="239.0" text-anchor="start" class="mu">arrêté à 16:00</text>
<line x1="497.4" y1="100.0" x2="497.4" y2="255.0" class="flko"/>
<text x="503.4" y="262.0" text-anchor="start" class="ko b">17:00 : Dupont part</text>
<rect x="24.0" y="314.0" width="18.0" height="14.0" rx="2" class="pres"/>
<text x="50.0" y="325.0" text-anchor="start" class="mu">présence pointée</text>
<rect x="179.2" y="314.0" width="18.0" height="14.0" rx="2" class="of"/>
<text x="205.2" y="325.0" text-anchor="start" class="mu">travail sur un OF</text>
<rect x="341.6" y="314.0" width="18.0" height="14.0" rx="2" class="err"/>
<text x="367.6" y="325.0" text-anchor="start" class="mu">compté à tort</text>
<text x="24.0" y="347.0" text-anchor="start" class="mu">Seul le départ ferme une journée. Sans lui, la dernière période reste ouverte et avale la nuit.</text>
</svg>
