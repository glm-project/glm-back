logging:
  level:
    com:
      glm:
        glmback: INFO
spring:
  application:
    name: glmproject
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      poolName: Hikari
    password: ''
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/glmproject
    username: glmproject
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        generate_statistics: false
        jdbc:
          batch_size: 25
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
  liquibase:
    enabled: false
    change-log: classpath:config/liquibase/master.xml
  jackson:
    default-property-inclusion: non_absent
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: http://localhost:9080/realms/glmproject
        registration:
          oidc:
            client-id: web_app
            client-secret: web_app
            scope: openid,profile,email
server:
  port: 8080
springdoc:
  # La description de l'API n'est servie qu'en developpement et en test : elle est eteinte par defaut, et rallumee
  # par les profils local et test. Un environnement qui oublierait de se declarer n'expose donc rien, plutot que
  # l'inverse — c'est aussi ce qui protege le futur profil de production, qui n'existe pas encore.
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
application:
  security:
    oauth2:
      audience: account,api://default
  multitenancy:
    # Aucune entreprise par defaut : impeccmold et katilys sont un jeu de developpement,
    # declare dans les profils local et test. Voir documentation/multitenancy.md.
    tenants: []
