logging:
  config: classpath:logback.xml
spring:
  main:
    banner-mode: 'off'
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 2
    password: ''
    url: jdbc:tc:postgresql:18.4:///glmproject?TC_TMPFS=/testtmpfs:rw
    username: glmproject
  liquibase:
    contexts: test
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: http://DO_NOT_CALL:9080/realms/glmproject
server:
  port: 0
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
application:
  multitenancy:
    tenants:
      - id: impeccmold
        schema: impeccmold
      - id: katilys
        schema: katilys
